    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="אקדמיית תכנון לוחות — קורס עומק אישי בתכנון PCB במהירות גבוהה: שלמות אות, שלמות הספק, תאימות EMC וסידור פיזי."
    />
    <title>אקדמיית תכנון לוחות</title>
    <script type="text/javascript">
      // Counterpart to public/404.html's GitHub Pages SPA redirect trick:
      // restores the real deep-linked path before react-router mounts.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
